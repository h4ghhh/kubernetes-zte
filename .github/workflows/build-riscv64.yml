# Build and publish Kubernetes artifacts for linux/riscv64
#
# Adapted for this fork's current tree (k8s 1.38, go from .go-version).
# Runs natively on RISC-V hardware -- RISE Project GitHub runners or any
# self-hosted riscv64 runner carrying the configured label.
# See: https://github.com/riseproject-dev/riscv-runner-images
#
# Produces:
#   - Kubernetes binaries (kubelet, kubeadm, kubectl, kube-apiserver, etc.)
#   - Kubernetes component images (kube-apiserver, kube-proxy, etc.)
#   - Dependency base images (kube-cross, go-runner, distroless-iptables, setcap)
#   - Ecosystem images (etcd, CoreDNS, Flannel)
#   - Binary tarballs for distribution
#
# Versions are derived from this tree at run time (build/build-image/cross/VERSION,
# build/common.sh, cmd/kubeadm/app/constants, build/pause/Makefile) so they track
# the current version instead of drifting. The "-trixie" tag suffix reflects the
# Debian Trixie based Dockerfiles under riscv64/images/.

name: Build riscv64

on:
  push:
    branches: [master]
    paths:
      - 'riscv64/**'
      - 'hack/lib/golang.sh'
      - '.github/workflows/build-riscv64.yml'
  workflow_dispatch:
    inputs:
      k8s_version:
        description: 'Kubernetes version (e.g. v1.38.0); defaults to what the binaries report'
        required: false
      runs_on:
        description: 'Runner label (must be a native riscv64 host)'
        required: false
        default: 'ubuntu-24.04-riscv'
      publish:
        description: 'Push images and create release'
        type: boolean
        default: false
  schedule:
    # Monthly build: first Monday at 06:00 UTC
    - cron: '0 6 1-7 * 1'

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # Flannel is not pinned anywhere in the Kubernetes tree; bump manually.
  FLANNEL_VERSION: v0.28.0

jobs:
  build-binaries:
    name: Build binaries
    runs-on: ${{ inputs.runs_on || 'ubuntu-24.04-riscv' }}
    timeout-minutes: 180
    outputs:
      k8s_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clean workspace
        run: sudo rm -rf _output/ || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Install Go
        run: |
          GO_VERSION=$(cat .go-version)
          echo "GO_VERSION=${GO_VERSION}" >> "$GITHUB_ENV"
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-riscv64.tar.gz" \
            | sudo tar -C /usr/local -xz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"

      - name: Verify Go
        run: |
          go version
          go env GOARCH  # should print riscv64

      - name: Build all binaries
        run: |
          # Native build -- no cross-compilation needed. Without
          # KUBE_BUILD_PLATFORMS, make all builds the host platform only
          # (riscv64 must be in KUBE_SUPPORTED_*_PLATFORMS, see
          # hack/lib/golang.sh).
          make all \
            WHAT="cmd/kubelet cmd/kubeadm cmd/kubectl \
                  cmd/kube-apiserver cmd/kube-controller-manager \
                  cmd/kube-scheduler cmd/kube-proxy \
                  staging/src/k8s.io/component-base/logs/kube-log-runner"

      - name: Determine version
        id: version
        run: |
          K8S_VERSION="${{ inputs.k8s_version || '' }}"
          if [ -z "${K8S_VERSION}" ]; then
            K8S_VERSION=$(git describe --tags --abbrev=0 --match='v*' 2>/dev/null || true)
          fi
          if [ -z "${K8S_VERSION}" ]; then
            # Forks often carry no git tags; fall back to what the binaries report.
            K8S_VERSION=$(_output/local/bin/linux/riscv64/kube-apiserver --version \
              | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
          fi
          if [ -z "${K8S_VERSION}" ]; then
            echo "::error::Cannot determine Kubernetes version (no git tags, kube-apiserver --version unparsable). Pass the k8s_version input."
            exit 1
          fi
          echo "K8S_VERSION=${K8S_VERSION}" >> "$GITHUB_ENV"
          echo "version=${K8S_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify binaries
        run: |
          for bin in kubectl kubeadm kubelet kube-apiserver \
                     kube-controller-manager kube-scheduler kube-proxy; do
            echo -n "${bin}: "
            file "_output/local/bin/linux/riscv64/${bin}" | grep -q "RISC-V" && echo "OK" || echo "FAIL"
          done
          # Functional check
          _output/local/bin/linux/riscv64/kubectl version --client
          _output/local/bin/linux/riscv64/kubeadm version
          _output/local/bin/linux/riscv64/kubelet --version

      - name: Package binary tarballs
        run: |
          mkdir -p _dist

          tar czf "_dist/kubernetes-server-linux-riscv64-${K8S_VERSION}.tar.gz" \
            -C _output/local/bin/linux/riscv64 \
            kube-apiserver kube-controller-manager kube-scheduler kube-proxy kubelet

          tar czf "_dist/kubernetes-node-linux-riscv64-${K8S_VERSION}.tar.gz" \
            -C _output/local/bin/linux/riscv64 \
            kubelet kubeadm kubectl

          tar czf "_dist/kubernetes-client-linux-riscv64-${K8S_VERSION}.tar.gz" \
            -C _output/local/bin/linux/riscv64 \
            kubectl

          ls -lh _dist/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-riscv64-binaries
          path: _output/local/bin/linux/riscv64/
          retention-days: 7

      - name: Upload tarballs
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-riscv64-tarballs
          path: _dist/
          retention-days: 30

  build-images:
    name: Build images
    runs-on: ${{ inputs.runs_on || 'ubuntu-24.04-riscv' }}
    timeout-minutes: 180
    needs: build-binaries
    outputs:
      pause_tag: ${{ steps.versions.outputs.pause_tag }}
      etcd_version: ${{ steps.versions.outputs.etcd_version }}
      coredns_version: ${{ steps.versions.outputs.coredns_version }}
      flannel_version: ${{ steps.versions.outputs.flannel_version }}
    steps:
      - name: Clean workspace
        run: sudo rm -rf _output/ || true

      - name: Set up container engine
        run: |
          # Container runners (riseproject-dev/riscv-runner pods) already run
          # dockerd from the entrypoint -- use it directly. Podman cannot work
          # there: its overlay driver refuses an overlayfs backing store, and
          # fuse-overlayfs is not part of the image. Bare VM runners without a
          # daemon fall back to rootful podman behind a docker shim.
          if docker info >/dev/null 2>&1 || sudo docker info >/dev/null 2>&1; then
            echo "Using the preinstalled Docker daemon"
            exit 0
          fi

          command -v podman >/dev/null || {
            echo "::error::No Docker daemon reachable and no podman to shim"
            exit 1
          }
          if ! sudo podman info &>/dev/null; then
            sudo podman system reset --force 2>/dev/null || true
            sudo rm -rf /var/lib/containers 2>/dev/null || true
            sudo mkdir -p /etc/containers
            if FUSE_OVERLAYFS=$(command -v fuse-overlayfs); then
              printf '[storage]\ndriver = "overlay"\n\n[storage.options.overlay]\nmount_program = "%s"\n' \
                "${FUSE_OVERLAYFS}" \
                | sudo tee /etc/containers/storage.conf > /dev/null
            else
              printf '[storage]\ndriver = "vfs"\n' \
                | sudo tee /etc/containers/storage.conf > /dev/null
            fi
          fi
          printf '#!/bin/bash\nexec sudo /usr/bin/podman "$@"\n' | sudo tee /usr/local/bin/docker > /dev/null
          sudo chmod +x /usr/local/bin/docker
          docker info > /dev/null

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 100
          fetch-tags: true

      - name: Resolve versions from tree
        id: versions
        run: |
          # Take version numbers from the files that define them so the
          # images stay aligned with the current tree; append "-trixie"
          # because the riscv64 Dockerfiles build Debian Trixie variants.
          GO_VERSION=$(cat .go-version)

          # build/build-image/cross/VERSION, e.g. v1.37.0-go1.26.5-bullseye.0
          KUBE_CROSS_TAG="v$(sed -E 's/^v//; s/-go.*//' build/build-image/cross/VERSION)-go${GO_VERSION}-trixie.0"
          # build/common.sh, e.g. v2.4.0-go1.26.5-bookworm.0
          GO_RUNNER_TAG="$(grep -oP '__default_go_runner_version=\K\S+' build/common.sh | tr -d '"' | sed -E 's/-go.*//')-go${GO_VERSION}-trixie.0"
          # build/common.sh, e.g. bookworm-v1.0.6
          SETCAP_TAG="trixie-$(grep -oP '__default_setcap_version=\K\S+' build/common.sh | tr -d '"' | sed 's/^[a-z]*-//')"
          # build/common.sh, e.g. v0.9.6
          IPTABLES_TAG="$(grep -oP '__default_distroless_iptables_version=\K\S+' build/common.sh | tr -d '"')-trixie.0"
          # cmd/kubeadm/app/constants/constants.go DefaultEtcdVersion, e.g. "3.7.1-0"
          ETCD_VERSION="v$(grep -oP 'DefaultEtcdVersion = "\K[0-9.]+' cmd/kubeadm/app/constants/constants.go)"
          # cmd/kubeadm/app/constants/constants.go CoreDNSVersion
          COREDNS_VERSION=$(grep -oP 'CoreDNSVersion = "\K[^"]+' cmd/kubeadm/app/constants/constants.go)
          # build/pause/Makefile
          PAUSE_TAG=$(grep -oP '^TAG \?= \K\S+' build/pause/Makefile)
          FLANNEL_VERSION="${FLANNEL_VERSION}"

          echo "GO_VERSION=${GO_VERSION}"                  >> "$GITHUB_ENV"
          echo "KUBE_CROSS_TAG=${KUBE_CROSS_TAG}"          >> "$GITHUB_ENV"
          echo "GO_RUNNER_TAG=${GO_RUNNER_TAG}"            >> "$GITHUB_ENV"
          echo "SETCAP_TAG=${SETCAP_TAG}"                  >> "$GITHUB_ENV"
          echo "IPTABLES_TAG=${IPTABLES_TAG}"              >> "$GITHUB_ENV"
          echo "ETCD_VERSION=${ETCD_VERSION}"              >> "$GITHUB_ENV"
          echo "COREDNS_VERSION=${COREDNS_VERSION}"        >> "$GITHUB_ENV"
          echo "PAUSE_TAG=${PAUSE_TAG}"                    >> "$GITHUB_ENV"

          echo "pause_tag=${PAUSE_TAG}"                >> "$GITHUB_OUTPUT"
          echo "etcd_version=${ETCD_VERSION}"          >> "$GITHUB_OUTPUT"
          echo "coredns_version=${COREDNS_VERSION}"    >> "$GITHUB_OUTPUT"
          echo "flannel_version=${FLANNEL_VERSION}"    >> "$GITHUB_OUTPUT"

          echo "Resolved versions:"
          echo "  kube-cross: ${KUBE_CROSS_TAG}"
          echo "  go-runner: ${GO_RUNNER_TAG}"
          echo "  setcap: ${SETCAP_TAG}"
          echo "  distroless-iptables: ${IPTABLES_TAG}"
          echo "  etcd: ${ETCD_VERSION}"
          echo "  coredns: ${COREDNS_VERSION}"
          echo "  pause: ${PAUSE_TAG}"
          echo "  flannel: ${FLANNEL_VERSION}"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: kubernetes-riscv64-binaries
          path: _output/local/bin/linux/riscv64/

      - name: Restore binary permissions
        run: chmod +x _output/local/bin/linux/riscv64/*

      - name: Determine version
        run: |
          K8S_VERSION="${{ needs.build-binaries.outputs.k8s_version }}"
          if [ -z "${K8S_VERSION}" ]; then
            echo "::error::build-binaries did not report a version"
            exit 1
          fi
          echo "K8S_VERSION=${K8S_VERSION}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            sudo docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build dependency images
        run: |
          # kube-cross
          sudo docker build \
            --build-arg GO_VERSION="${GO_VERSION}" \
            -t "${REGISTRY}/kube-cross:${KUBE_CROSS_TAG}" \
            riscv64/images/kube-cross/

          # go-runner
          sudo docker build \
            --build-arg GO_VERSION="${GO_VERSION}" \
            -t "${REGISTRY}/go-runner:${GO_RUNNER_TAG}" \
            riscv64/images/go-runner/

          # setcap
          sudo docker build \
            -t "${REGISTRY}/setcap:${SETCAP_TAG}" \
            riscv64/images/setcap/

          # distroless-iptables
          sudo docker build \
            --build-arg GORUNNERIMAGE="${REGISTRY}/go-runner:${GO_RUNNER_TAG}" \
            -t "${REGISTRY}/distroless-iptables:${IPTABLES_TAG}" \
            riscv64/images/distroless-iptables/

      - name: Push dependency images
        run: |
          # BuildKit pulls base images from the registry rather than the
          # local Docker store, so dependency images must be pushed before
          # building server images.
          sudo docker push "${REGISTRY}/kube-cross:${KUBE_CROSS_TAG}"
          sudo docker push "${REGISTRY}/go-runner:${GO_RUNNER_TAG}"
          sudo docker push "${REGISTRY}/setcap:${SETCAP_TAG}"
          sudo docker push "${REGISTRY}/distroless-iptables:${IPTABLES_TAG}"

      - name: Build Kubernetes component images
        run: |
          export KUBE_BUILD_PLATFORMS=linux/riscv64
          export KUBE_DOCKER_REGISTRY="${REGISTRY}"
          export KUBE_BASE_IMAGE_REGISTRY="${REGISTRY}"
          export KUBE_GORUNNER_IMAGE="${REGISTRY}/go-runner:${GO_RUNNER_TAG}"
          export KUBE_PROXY_BASE_IMAGE="${REGISTRY}/distroless-iptables:${IPTABLES_TAG}"
          export KUBE_BUILD_SETCAP_IMAGE="${REGISTRY}/setcap:${SETCAP_TAG}"

          # Set version explicitly -- the fork may lack upstream tags
          export KUBE_GIT_VERSION="${K8S_VERSION}"
          export KUBE_GIT_TREE_STATE="clean"

          # Stage natively-built binaries where the release scripts expect them.
          # make release-images normally rebuilds inside kube-cross, but we
          # build natively so we skip the containerized compile.
          mkdir -p _output/dockerized/bin/linux/riscv64
          cp _output/local/bin/linux/riscv64/* _output/dockerized/bin/linux/riscv64/

          # Run as root so that docker save and the subsequent hard links in
          # the release script share the same UID.
          sudo -E bash -c '
            source build/common.sh
            source build/lib/release.sh
            kube::build::verify_prereqs
            kube::release::build_server_images
          '

      - name: Build pause image
        run: |
          cd build/pause
          REV=$(git describe --contains --always --match='v*' 2>/dev/null || git rev-parse --short HEAD)
          mkdir -p bin
          gcc -Os -Wall -Werror -static -DVERSION=v${PAUSE_TAG}-${REV} \
            -o bin/pause-linux-riscv64 linux/pause.c
          strip bin/pause-linux-riscv64
          sudo docker build --platform linux/riscv64 \
            -t "${REGISTRY}/pause:${PAUSE_TAG}-linux-riscv64" \
            --build-arg BASE=scratch --build-arg ARCH=riscv64 .

      - name: Build ecosystem images
        run: |
          # etcd
          sudo docker build \
            --build-arg ETCD_VERSION="${ETCD_VERSION}" \
            --build-arg GO_VERSION="${GO_VERSION}" \
            -t "${REGISTRY}/etcd:${ETCD_VERSION}-riscv64" \
            riscv64/ecosystem/etcd/

          # CoreDNS
          sudo docker build \
            --build-arg COREDNS_VERSION="${COREDNS_VERSION}" \
            --build-arg GO_VERSION="${GO_VERSION}" \
            -t "${REGISTRY}/coredns:${COREDNS_VERSION}-riscv64" \
            riscv64/ecosystem/coredns/

          # Flannel
          sudo docker build \
            --build-arg FLANNEL_VERSION="${FLANNEL_VERSION}" \
            --build-arg GO_VERSION="${GO_VERSION}" \
            -t "${REGISTRY}/flannel:${FLANNEL_VERSION}-riscv64" \
            riscv64/ecosystem/flannel/

      - name: Verify images
        run: |
          echo "=== Kubernetes component images ==="
          for img in kube-apiserver kube-controller-manager kube-scheduler kube-proxy; do
            echo -n "${img}-riscv64: "
            sudo docker inspect "${REGISTRY}/${img}-riscv64:${K8S_VERSION}" --format '{{.Architecture}}' 2>/dev/null || echo "MISSING"
          done

          echo "=== Dependency images ==="
          for img in "kube-cross:${KUBE_CROSS_TAG}" \
                     "go-runner:${GO_RUNNER_TAG}" \
                     "distroless-iptables:${IPTABLES_TAG}" \
                     "setcap:${SETCAP_TAG}" \
                     "pause:${PAUSE_TAG}-linux-riscv64"; do
            echo -n "${img}: "
            sudo docker inspect "${REGISTRY}/${img}" --format '{{.Architecture}}' 2>/dev/null || echo "MISSING"
          done

          echo "=== Ecosystem images ==="
          for img in "etcd:${ETCD_VERSION}-riscv64" \
                     "coredns:${COREDNS_VERSION}-riscv64" \
                     "flannel:${FLANNEL_VERSION}-riscv64"; do
            echo -n "${img}: "
            sudo docker inspect "${REGISTRY}/${img}" --format '{{.Architecture}}' 2>/dev/null || echo "MISSING"
          done

      - name: Push images
        if: inputs.publish == true || github.event_name == 'schedule'
        run: |
          # Kubernetes components (arch-suffixed per upstream convention)
          for img in kube-apiserver kube-controller-manager kube-scheduler kube-proxy; do
            sudo docker push "${REGISTRY}/${img}-riscv64:${K8S_VERSION}"
          done

          # Pause
          sudo docker push "${REGISTRY}/pause:${PAUSE_TAG}-linux-riscv64"

          # Dependency images (already pushed before make release-images,
          # re-push is a no-op but keeps the release gate explicit)
          sudo docker push "${REGISTRY}/kube-cross:${KUBE_CROSS_TAG}"
          sudo docker push "${REGISTRY}/go-runner:${GO_RUNNER_TAG}"
          sudo docker push "${REGISTRY}/distroless-iptables:${IPTABLES_TAG}"
          sudo docker push "${REGISTRY}/setcap:${SETCAP_TAG}"

          # Ecosystem
          sudo docker push "${REGISTRY}/etcd:${ETCD_VERSION}-riscv64"
          sudo docker push "${REGISTRY}/coredns:${COREDNS_VERSION}-riscv64"
          sudo docker push "${REGISTRY}/flannel:${FLANNEL_VERSION}-riscv64"

      - name: Log out of GHCR
        if: always()
        run: sudo docker logout ghcr.io || true

  release:
    name: Create release
    runs-on: ubuntu-24.04
    needs: [build-binaries, build-images]
    if: inputs.publish == true
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          name: kubernetes-riscv64-tarballs
          path: _dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          K8S_VERSION: ${{ needs.build-binaries.outputs.k8s_version }}
          PAUSE_TAG: ${{ needs.build-images.outputs.pause_tag }}
          ETCD_VERSION: ${{ needs.build-images.outputs.etcd_version }}
          COREDNS_VERSION: ${{ needs.build-images.outputs.coredns_version }}
          FLANNEL_VERSION: ${{ needs.build-images.outputs.flannel_version }}
        run: |
          gh release create "${K8S_VERSION}-riscv64" \
            -R "${{ github.repository }}" \
            --title "Kubernetes ${K8S_VERSION} for riscv64" \
            --notes "Community build of Kubernetes ${K8S_VERSION} for \`linux/riscv64\`.

          **This is NOT an official Kubernetes release.** Build instructions live in
          the [riscv64 build guide](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/riscv64/docs/building.md).

          ### Container images

          All images published to \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/\`:

          | Image | Tag |
          |-------|-----|
          | kube-apiserver-riscv64 | \`${K8S_VERSION}\` |
          | kube-controller-manager-riscv64 | \`${K8S_VERSION}\` |
          | kube-scheduler-riscv64 | \`${K8S_VERSION}\` |
          | kube-proxy-riscv64 | \`${K8S_VERSION}\` |
          | pause | \`${PAUSE_TAG}-linux-riscv64\` |
          | etcd | \`${ETCD_VERSION}-riscv64\` |
          | coredns | \`${COREDNS_VERSION}-riscv64\` |
          | flannel | \`${FLANNEL_VERSION}-riscv64\` |

          ### Deployment

          See [cluster-setup.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/master/riscv64/docs/cluster-setup.md)" \
            _dist/kubernetes-server-linux-riscv64-${K8S_VERSION}.tar.gz \
            _dist/kubernetes-node-linux-riscv64-${K8S_VERSION}.tar.gz \
            _dist/kubernetes-client-linux-riscv64-${K8S_VERSION}.tar.gz
